packages:
  - "web"
  - "admin"
  - "docs"
  - "compiler"
  - "shared_modules"
  - "web-next"
  - "admin-next"

# pnpm-only (npm ignores this file — avoids unknown .npmrc key warnings)
publicHoistPattern:
  - "*"
autoInstallPeers: true
strictPeerDependencies: false
childConcurrency: 5
networkConcurrency: 32
packageImportMethod: copy

onlyBuiltDependencies:
  - esbuild
  - "@parcel/watcher"
  - sharp
  - supabase

ignoredBuiltDependencies:
  - workerd

allowedDeprecatedVersions:
  unplugin-vue-router: '*'
  whatwg-encoding: '*'
